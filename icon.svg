<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.8" />

  <!-- 4 Ludo Quadrants Mini Decorative Ring -->
  <circle cx="170" cy="170" r="32" fill="#10b981" opacity="0.9" />
  <circle cx="342" cy="170" r="32" fill="#ef4444" opacity="0.9" />
  <circle cx="342" cy="342" r="32" fill="#f59e0b" opacity="0.9" />
  <circle cx="170" cy="342" r="32" fill="#0ea5e9" opacity="0.9" />

  <!-- Center Trophy Crest -->
  <circle cx="256" cy="256" r="140" fill="#09090b" stroke="url(#gold)" stroke-width="10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="125" fill="#18181b" />

  <!-- 804 Bold Brand Text -->
  <text x="256" y="278" font-family="Arial Black, Impact, sans-serif" font-size="110" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="-3">804</text>
  <text x="256" y="325" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="8">LUDO</text>

  <!-- Stars -->
  <polygon points="256,155 262,172 280,172 266,183 271,200 256,189 241,200 246,183 232,172 250,172" fill="#fbbf24" />
</svg>
